[package]
name = "gpui_hello"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gpui_hello"
path = "src/main.rs"

[dependencies]
# `inspector` keeps gpui_macros::derive_inspector_reflection defined in both the
# target and exec builds, which otherwise disagree on its `debug_assertions` gate.
gpui = { workspace = true, features = ["inspector"] }
# Without the wayland feature gpui_linux's compositor match panics `unreachable`.
gpui_platform = { workspace = true, features = ["wayland"] }
bviz_ui_components = { path = "../ui/components" }
bviz_ui_shell = { path = "../ui/shell" }
bviz_ui_theme = { path = "../ui/theme" }
