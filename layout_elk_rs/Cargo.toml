[package]
name = "layout_elk_rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "layout_elk_rs"
path = "src/main.rs"

[dependencies]
org-eclipse-elk-graph-json = { workspace = true }
serde_json = { workspace = true }
prost = { workspace = true }
# Locked for the prost toolchain (@crates//:prost-types,
# @crates//:protoc-gen-prost__protoc-gen-prost), not used by this crate's code.
prost-types = { workspace = true }
protoc-gen-prost = { workspace = true }
