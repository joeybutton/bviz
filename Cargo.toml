[workspace]
members = [
    "alloc",
    "bazel_viz",
    "graph/layout",
    "greeting",
    "gpui_hello",
    "terminal",
    "trace/layout",
    "trace/profile",
    "ui/graph",
    "ui/trace",
]
resolver = "2"

[workspace.dependencies]
alacritty_terminal = "0.26"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
mimalloc = "0.1"
num_cpus = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
org-eclipse-elk-alg-layered = { git = "https://github.com/openedges/elk-rs", tag = "v0.11.0+rs.2" }
org-eclipse-elk-core = { git = "https://github.com/openedges/elk-rs", tag = "v0.11.0+rs.2" }
org-eclipse-elk-graph = { git = "https://github.com/openedges/elk-rs", tag = "v0.11.0+rs.2" }
prost = "0.13"
prost-types = "0.13"
protoc-gen-prost = "0.4"
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.6.3" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.6.3" }
