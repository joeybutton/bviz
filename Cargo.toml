[workspace]
members = [
    "alloc",
    "bviz",
    "cli",
    "graph/layout",
    "terminal",
    "tools/scene_header",
    "trace/layout",
    "trace/profile",
    "ui/assets",
    "ui/components",
    "ui/console",
    "ui/console/args",
    "ui/graph",
    "ui/graph/args",
    "ui/shell",
    "ui/theme",
    "ui/trace",
    "ui/trace/args",
    "ui/workspace",
    "util/parallel",
]
resolver = "2"

[workspace.dependencies]
alacritty_terminal = "0.26"
bviz_parallel = { path = "util/parallel" }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
flate2 = { version = "1", features = ["zlib-rs"] }
hashbrown = { version = "0.16", default-features = false }
libmimalloc-sys = "0.1"
mimalloc = "0.1"
num_cpus = "1"
rayon = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
org-eclipse-elk-alg-layered = { git = "https://github.com/openedges/elk-rs", tag = "v0.11.0+rs.2" }
org-eclipse-elk-core = { git = "https://github.com/openedges/elk-rs", tag = "v0.11.0+rs.2" }
org-eclipse-elk-graph = { git = "https://github.com/openedges/elk-rs", tag = "v0.11.0+rs.2" }
prost = "0.13"
prost-types = "0.13"
protoc-gen-prost = "0.4"
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.6.3" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.6.3" }
