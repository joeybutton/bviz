[package]
name = "bviz_ui_graph"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "graph"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
gpui = { workspace = true, features = ["inspector"] }
bviz_graph_layout = { path = "../../graph/layout" }
bviz_ui_assets = { path = "../assets" }
bviz_ui_components = { path = "../components" }
bviz_ui_graph_args = { path = "args" }
bviz_ui_shell = { path = "../shell" }
bviz_ui_theme = { path = "../theme" }
