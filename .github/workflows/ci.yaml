name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - run: bazel build //...
      # Report every check's verdict, not only the first failure's.
      - run: bazel test //...
        if: ${{ !cancelled() }}
      - run: bazel build --config=rustfmt //...
        if: ${{ !cancelled() }}
      - run: bazel build --config=clippy //...
        if: ${{ !cancelled() }}
