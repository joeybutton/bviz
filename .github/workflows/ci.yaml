name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelrc: build --platforms=//platforms:linux_x86_64
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - uses: ./.github/actions/buildbuddy

      # Report every check's verdict, not only the first failure's.
      - run: bazel test --config=check --keep_going --test_output=errors //... //dist:bviz-linux-x86_64
      - name: Report disk usage
        run: |
          df -h /
          du -sh ~/.cache/bazel-disk ~/.cache/bazel-repo ~/.cache/bazelisk ~/.bazel || true
        if: ${{ !cancelled() }}
