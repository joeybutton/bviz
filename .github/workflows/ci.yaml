name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelrc: |
            common --config=ci
            build --platforms=//platforms:linux_x86_64
          bazelisk-cache: true
      - uses: ./.github/actions/buildbuddy

      # Report every check's verdict, not only the first failure's. The check
      # needs none of the outputs on the runner, so none are downloaded.
      - run: bazel test --config=check --remote_download_minimal --keep_going --test_output=errors //... //dist:bviz-linux-x86_64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: remote-build-logs
          path: |
            bazel-remote-grpc.log
            execution_log.binpb.zst
          retention-days: 7
          if-no-files-found: ignore
