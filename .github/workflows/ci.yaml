name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelrc: build --platforms=//platforms:linux_x86_64
          bazelisk-cache: true
      - uses: ./.github/actions/buildbuddy

      # Report every check's verdict, not only the first failure's. The check
      # needs none of the outputs on the runner, so none are downloaded.
      - run: bazel test --config=check --remote_download_minimal --keep_going --test_output=errors //... //dist:bviz-linux-x86_64

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: remote-build-logs
          path: |
            bazel-remote-grpc.log
            execution_log.binpb.zst
          retention-days: 7
          if-no-files-found: ignore
