name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - id: setup
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelrc: build --platforms=//platforms:linux_x86_64
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - run: bazel build //... //dist:bviz-linux-x86_64
      # Report every check's verdict, not only the first failure's.
      - run: bazel test --test_output=errors //...
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      - run: bazel build --config=rustfmt //...
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      - run: bazel build --config=clippy //...
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      - name: Report disk usage
        run: |
          df -h /
          du -sh ~/.cache/bazel-disk ~/.cache/bazel-repo ~/.cache/bazelisk ~/.bazel || true
        if: ${{ !cancelled() }}
