name: Nightly

on:
  schedule:
    # Off the hour: scheduled runs are delayed most at the top of the hour.
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dist:
    uses: ./.github/workflows/dist.yaml
    secrets: inherit

  # One pre-release under a fixed tag, replaced on every run, so its download
  # links stay stable and always point at the latest build of main. It is
  # published only when every platform built.
  release:
    needs: dist
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bviz-*.tar.gz
          merge-multiple: true
          path: dist
      - uses: ./.github/actions/release-notes
        with:
          tag: ${{ env.TAG }}
          summary: Built from ${{ github.sha }}. Each nightly build replaces this release.

      # Deleting the release together with its tag lets the new one tag this
      # run's commit.
      - run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          gh release create "$TAG" dist/bviz-*.tar.gz \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly" \
            --notes-file notes.md
