name: Dist

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelrc: common --config=ci
          bazelisk-cache: true
          disk-cache: ${{ secrets.BUILDBUDDY_API_KEY == '' }}
          repository-cache: ${{ secrets.BUILDBUDDY_API_KEY == '' }}
      - uses: ./.github/actions/buildbuddy
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      # --keep_going so one platform's failure still yields the others' tarballs.
      - run: bazel build -c opt --config=release --keep_going //dist
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: remote-build-logs
          path: |
            bazel-remote-grpc.log
            execution_log.binpb.zst
          retention-days: 7
          if-no-files-found: ignore

      # GitHub implies success() on an `if:` that names no status function, so
      # without !cancelled() a failed build would skip the uploads that report
      # which platform is missing.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          path: bazel-bin/dist/bviz-linux-arm64.tar.gz
          archive: false
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          path: bazel-bin/dist/bviz-linux-x86_64.tar.gz
          archive: false
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          path: bazel-bin/dist/bviz-macos-arm64.tar.gz
          archive: false
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          path: bazel-bin/dist/bviz-macos-x86_64.tar.gz
          archive: false
          retention-days: 14
          if-no-files-found: error
