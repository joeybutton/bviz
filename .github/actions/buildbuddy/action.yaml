name: BuildBuddy
description: >-
  Build and test on BuildBuddy remote execution when given an API key; without
  one, Bazel builds locally. A step that runs Bazel against BuildBuddy needs the
  key in its environment as BUILDBUDDY_API_KEY, where the credential helper
  reads it.

inputs:
  api-key:
    description: The BuildBuddy API key, empty where the run has none.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - if: inputs.api-key != ''
      shell: bash
      run: |
        cat >> user.bazelrc <<'RC'
        common --credential_helper=yume.buildbuddy.io=%workspace%/.github/actions/buildbuddy/credential-helper
        build --config=remote
        build --build_metadata=ROLE=CI
        RC
