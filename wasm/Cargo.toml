# Its own workspace, so the Bazel build's crate pins (the root Cargo.lock) are
# untouched: bviz's libraries are taken by path, their own dependencies from
# the root workspace's declarations.
[workspace]

[package]
name = "bviz_wasm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "WebAssembly bindings over bviz's trace parser, lane layout, flame graph and critical path"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
bviz_critical_path = { path = "../critical_path" }
bviz_invocation = { path = "../invocation" }
bviz_trace_layout = { path = "../trace/layout" }
bviz_trace_profile = { path = "../trace/profile" }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
